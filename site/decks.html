<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivio mazzi · NEXUS</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
    integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
  <script defer src="js/account.js"></script>
  <script type="module" src="js/decks.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img src="img_misc/logo.png" alt="NEXUS Tournaments" width="2172" height="724">
      </a>
      <details class="account-menu" id="account-menu">
        <summary class="account-trigger" id="account-label">Accedi</summary>
        <div class="account-panel">
          <p id="auth-status" role="status">Verifica della sessione…</p>
          <button class="button primary" type="button" id="sign-in" hidden>Accedi con Discord</button>
          <button class="button" type="button" id="sign-out" hidden>Esci</button>
        </div>
      </details>
    </div>
  </header>
  <main class="shell" id="decks">
    <div class="page-intro" id="deck-intro">
      <p class="eyebrow">Liste della community</p>
      <h1>Archivio mazzi</h1>
      <p>Esplora i mazzi del Deck Builder e consulta le carte che compongono ogni lista.</p>
    </div>
    <div class="filters" id="deck-filters" hidden>
      <label>Cerca <input type="search" id="deck-search" placeholder="Nome del mazzo, autore o carta"></label>
    </div>
    <noscript><p>Attiva JavaScript per consultare i mazzi.</p></noscript>
    <p id="status" class="status" role="status">Caricamento dei mazzi…</p>
    <div id="deck-list" class="deck-grid"></div>
  </main>
</body>
</html>
