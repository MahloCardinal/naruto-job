<!doctype html>
<html lang="it" data-title="cards.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista carte · NEXUS</title>
  <link rel="icon" type="image/svg+xml" href="img_misc/favicon.svg?v=2">
  <link rel="stylesheet" href="styles.css">
  <script src="js/language-preference.js"></script>
  <script type="module" src="js/i18n.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
    integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
  <script type="module" src="js/account.js"></script>
  <script type="module" src="js/cards.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img src="img_misc/logo.png" alt="NEXUS Tournaments" width="2172" height="724">
      </a>
      <div class="header-controls">
        <details class="language-menu">
          <summary class="language-trigger" aria-label="Lingua: Italiano">
            <img src="img_misc/flag-it.svg" width="18" height="13" alt="">
            <span class="language-code">IT</span>
            <span aria-hidden="true">▾</span>
          </summary>
          <div class="language-panel">
            <button class="language-option" type="button" data-language="it" lang="it"><img src="img_misc/flag-it.svg" width="18" height="13" alt="">Italiano</button>
            <button class="language-option" type="button" data-language="en" lang="en"><img src="img_misc/flag-gb.svg" width="18" height="13" alt="">English</button>
          </div>
        </details>
        <details class="account-menu" id="account-menu">
          <summary class="account-trigger" id="account-label" data-i18n="auth.login">Accedi</summary>
          <div class="account-panel">
            <p id="auth-status" role="status" data-i18n="auth.check">Verifica della sessione…</p>
            <button class="button primary" type="button" id="sign-in" data-i18n="auth.discord" hidden>Accedi con Discord</button>
            <button class="button" type="button" id="sign-out" data-i18n="auth.logout" hidden>Esci</button>
          </div>
        </details>
      </div>
    </div>
  </header>
  <main class="shell">
    <div class="page-intro">
      <div class="section-heading">
        <span class="section-portrait"><img src="img_misc/konohamaru.webp" alt=""></span>
        <h1 data-i18n="cards.title">Lista carte</h1>
      </div>
      <p data-i18n="cards.intro">Cerca una carta e apri la sua scheda per leggere gli effetti di ciascun livello.</p>
    </div>
    <div class="filters" id="filters" hidden>
      <label><span data-i18n="search">Cerca</span> <input type="search" id="search" data-i18n-attr="placeholder:cards.placeholder" placeholder="Nome, ID o abilità"></label>
      <label><span data-i18n="cards.collection">Collezione</span>
        <select id="season">
          <option value="" data-i18n="all">Tutte</option>
          <option value="1">Season 1</option>
          <option value="2">Season 2</option>
          <option value="3">Season 3</option>
          <option value="Event">Event Scroll</option>
        </select>
      </label>
      <label><span data-i18n="cards.rarity">Rarità</span> <select id="rarity"><option value="" data-i18n="all">Tutte</option></select></label>
    </div>
    <noscript><p>Attiva JavaScript per consultare il catalogo.</p></noscript>
    <p id="status" class="status" role="status" data-i18n="cards.loading">Caricamento del catalogo…</p>
    <div id="cards" class="card-grid"></div>
    <button id="more" class="button more" type="button" data-i18n="cards.more" hidden>Mostra altre carte</button>
  </main>
  <footer class="site-footer" aria-label="Informazioni legali" data-i18n-attr="aria-label:legal">
    <a href="terms.html" data-i18n="legal.terms">Termini d’uso</a>
    <span aria-hidden="true">–</span>
    <a href="privacy.html">Privacy Policy</a>
  </footer>
</body>
</html>
